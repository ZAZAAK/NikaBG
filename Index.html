<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nika BG — Maintenance</title>

  <!-- Open Graph -->
  <meta property="og:title" content="Nika BG — Maintenance" />
  <meta property="og:description" content="Sorry, we are currently down for maintenance." />
  <meta property="og:image" content="https://i.ytimg.com/vi/ARGvnpaUUhY/oar2.jpg" />
  <meta property="og:type" content="website" />

  <link rel="icon" href="https://cdn.discordapp.com/avatars/1320695884270538792/f71f2e1e706c6581d2a675eef9bebe05.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      height: 100vh;
      font-family: 'Inter', sans-serif;
      background: radial-gradient(1200px 600px at top, #111827, #020617);
      color: #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
    }

    .glow {
      position: absolute;
      inset: -40%;
      background: radial-gradient(circle, rgba(56,189,248,0.15), transparent 60%);
      filter: blur(120px);
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 1;
      background: rgba(2, 6, 23, 0.75);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 18px;
      padding: 40px 30px;
      max-width: 420px;
      width: 90%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    }

    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.15);
      margin-bottom: 20px;
    }

    h1 {
      font-size: 1.9rem;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .grad {
      background: linear-gradient(90deg, #38bdf8, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      font-size: 0.95rem;
      color: #9ca3af;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    .btn {
      display: inline-block;
      padding: 12px 20px;
      border-radius: 12px;
      font-weight: 600;
      text-decoration: none;
      background: linear-gradient(90deg, #38bdf8, #6366f1);
      color: #020617;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 10px 30px rgba(56,189,248,0.35);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 40px rgba(99,102,241,0.45);
    }

    footer {
      position: absolute;
      bottom: 18px;
      font-size: 0.8rem;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <div class="glow"></div>

  <div class="card">
    <img
      src="https://yt3.googleusercontent.com/DV74d__eBiFtrIu9W4zkS0P3lyiWC6fAQSQhVdr4W3JHiF1a1leOqsWcQn5Q_EHdiGL5w1BbBg=s160-c-k-c0x00ffffff-no-rj"
      alt="Nika BG"
      class="avatar"
    />

    <h1>🚧 <span class="grad">We’re Temporarily Down</span></h1>
    <p>
      Sorry! The <strong>Nika BG</strong> website is currently under maintenance.<br>
      We’ll be back very soon with new updates 🚀
    </p>

    <a href="https://discord.gg/34bEyS9s" target="_blank" rel="noopener" class="btn">
      Join Discord for Updates
    </a>
  </div>

  <footer>
    © <span id="year"></span> Nika BG • Made by Ishaan
  </footer>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
