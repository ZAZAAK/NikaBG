<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nika Social Media Links</title>
    <style>
        /* General Styles */
        body {
            background-image: url('https://cdn.now.gg/apps-content/com.sandboxol.blockymods/fullhd-bg/blockman-go.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            font-family: 'Arial', sans-serif;
            color: #fff;
            text-align: center;
            margin: 0;
            background-blend-mode: overlay;
            background-color: rgba(0, 0, 0, 0.7);
            animation: fadeInBackground 1s ease-in-out;
        }

        h1 {
            font-size: 3.5em;
            margin-bottom: 20px;
            text-shadow: 3px 3px 8px rgba(0, 0, 0, 0.7);
        }

        .social-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            padding: 20px 0;
        }

        .social-button-container {
            text-align: center;
        }

        .button {
            display: inline-block;
            padding: 15px 30px;
            font-size: 1.2em;
            color: #fff;
            text-decoration: none;
            border-radius: 25px;
            position: relative;
            overflow: hidden;
            border: 2px solid transparent;
            transition: transform 0.3s, box-shadow 0.3s, background 0.3s;
        }

        .button:hover {
            transform: scale(1.1);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .button.tw { background: linear-gradient(45deg, #1da1f2, #0077b5); }
        .button.telegram { background: linear-gradient(45deg, #0088cc, #00aaff); }
        .button.youtube { background: linear-gradient(45deg, #ff0000, #cc0000); }
        .button.tiktok { background: linear-gradient(45deg, #010101, #1c1c1c); }
        .button.discord { background: linear-gradient(45deg, #5865f2, #404eed); }

        .social-info {
            font-size: 1em;
            margin-top: 5px;
            color: #ddd;
        }

        iframe {
            width: 80%;
            max-width: 800px;
            height: 450px;
            border: none;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            margin-top: 20px;
        }

        img {
            border-radius: 50%;
            width: 150px;
            height: 150px;
            margin-bottom: 20px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.7);
        }

        .footer-text {
            font-size: 1.2em;
            color: #ddd;
            margin-top: 30px;
        }

        .staff-section table {
            width: 80%;
            margin: 30px auto;
            border-collapse: collapse;
        }

        .staff-section th, .staff-section td {
            padding: 12px;
            border: 1px solid #444;
            text-align: left;
            font-size: 1.1em;
        }

        .staff-section th {
            background-color: #333;
            color: #fff;
        }

        .staff-section td {
            background-color: #444;
            color: #fff;
        }

        .discord-staff {
            background-color: #5865f2;
            color: #fff;
            font-weight: bold;
        }

        @keyframes fadeInBackground {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @media (max-width: 768px) {
            h1 { font-size: 2.5em; }
            iframe { height: 300px; }
            img { width: 120px; height: 120px; }
            .footer-text { font-size: 1em; }
            .staff-section table { width: 90%; }
        }

        @media (max-width: 500px) {
            h1 { font-size: 2em; }
            iframe { height: 250px; }
            img { width: 100px; height: 100px; }
            .footer-text { font-size: 0.9em; }
        }
    </style>
</head>
