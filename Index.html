    <style>
        body {
            background-image: url('https://cdn.now.gg/apps-content/com.sandboxol.blockymods/fullhd-bg/blockman-go.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            font-family: 'Arial', sans-serif;
            color: #fff;
            text-align: center;
            padding: 50px;
            background-blend-mode: overlay;
            background-color: rgba(0, 0, 0, 0.7);
            margin: 0;
        }

        h1 {
            font-size: 3em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.7);
            animation: fadeIn 2s ease-in-out;
        }

        .social-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            padding: 20px 0;
        }

        .social-button-container {
            text-align: center;
        }

        .button {
            display: inline-block;
            padding: 15px 30px;
            font-size: 1.2em;
            color: #fff;
            text-decoration: none;
            border-radius: 10px;
            position: relative;
            overflow: hidden;
            border: 2px solid transparent;
            transition: transform 0.3s, box-shadow 0.3s, background 0.3s;
        }

        .button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.2);
            transition: left 0.3s;
        }

        .button:hover::before {
            left: 100%;
        }

        .button:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            border: 2px solid #fff;
        }

        .button.tw { background: linear-gradient(45deg, #1da1f2, #0077b5); }
        .button.telegram { background: linear-gradient(45deg, #0088cc, #00aaff); }
        .button.youtube { background: linear-gradient(45deg, #ff0000, #cc0000); }
        .button.tiktok { background: linear-gradient(45deg, #010101, #1c1c1c); }
        .button.discord { background: linear-gradient(45deg, #5865f2, #404eed); }

        .featured-section {
            margin-top: 50px;
        }

        iframe {
            width: 80%;
            max-width: 800px;
            height: 450px;
            border: none;
            border-radius: 10px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
            margin-top: 20px;
        }

        img {
            border-radius: 50%;
            width: 150px;
            height: 150px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        .footer-text {
            font-size: 1.2em;
            color: #ddd;
            margin-top: 30px;
            animation: fadeIn 3s ease-in-out infinite alternate;
        }

        @keyframes fadeIn {
            from { opacity: 0.8; }
            to { opacity: 1; }
        }

        @media (max-width: 768px) {
            h1 { font-size: 2.5em; }
            .button { font-size: 1em; padding: 10px 20px; }
            iframe { height: 300px; }
        }
    </style>
</head>
