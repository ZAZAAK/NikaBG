<html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nika Social Media Links</title>
    <style>
        /* General Styles */
        body {
            background-image: url('https://cdn.now.gg/apps-content/com.sandboxol.blockymods/fullhd-bg/blockman-go.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            font-family: 'Arial', sans-serif;
            color: #fff;
            text-align: center;
            padding: 50px;
            background-blend-mode: overlay;
            background-color: rgba(0, 0, 0, 0.7);
            margin: 0;
            animation: fadeInBackground 1s ease-in-out;
        }

        h1 {
            font-size: 3.5em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.7);
            animation: fadeInText 2s ease-in-out;
        }

        .social-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            padding: 20px 0;
            animation: slideUp 1s ease-in-out;
        }

        .social-button-container {
            text-align: center;
            animation: fadeInUp 2s ease-in-out;
        }

        .button {
            display: inline-block;
            padding: 15px 30px;
            font-size: 1.2em;
            color: #fff;
            text-decoration: none;
            border-radius: 25px;
            position: relative;
            overflow: hidden;
            border: 2px solid transparent;
            transition: transform 0.3s, box-shadow 0.3s, background 0.3s;
            opacity: 0;
            animation: fadeInButton 1s forwards;
        }

        .button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.2);
            transition: left 0.3s;
        }

        .button:hover::before {
            left: 100%;
        }

        .button:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            border: 2px solid #fff;
        }

        .button.tw { background: linear-gradient(45deg, #1da1f2, #0077b5); }
        .button.telegram { background: linear-gradient(45deg, #0088cc, #00aaff); }
        .button.youtube { background: linear-gradient(45deg, #ff0000, #cc0000); }
        .button.tiktok { background: linear-gradient(45deg, #010101, #1c1c1c); }
        .button.discord { background: linear-gradient(45deg, #5865f2, #404eed); }

        .social-info {
            font-size: 1em;
            margin-top: 5px;
            color: #ddd;
            animation: fadeInUp 1.5s ease-in-out;
        }

        iframe {
            width: 80%;
            max-width: 800px;
            height: 450px;
            border: none;
            border-radius: 10px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
            margin-top: 20px;
            animation: fadeInIframe 2s ease-in-out;
        }

        img {
            border-radius: 50%;
            width: 150px;
            height: 150px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            animation: fadeInImage 1s ease-in-out;
        }

        .footer-text {
            font-size: 1.2em;
            color: #ddd;
            margin-top: 30px;
            animation: fadeIn 3s ease-in-out infinite alternate;
        }

        .staff-section {
            animation: fadeInUp 2s ease-in-out;
        }

        .staff-section table {
            width: 80%;
            margin: 30px auto;
            border-collapse: collapse;
            animation: fadeInTable 2s ease-in-out;
        }

        .staff-section th, .staff-section td {
            padding: 12px;
            border: 1px solid #444;
            text-align: left;
            font-size: 1.1em;
        }

        .staff-section th {
            background-color: #333;
            color: #fff;
        }

        .staff-section td {
            background-color: #444;
            color: #fff;
        }

        .discord-staff {
            background-color: #5865f2;
            color: #fff;
            font-weight: bold;
        }

        .staff-section tr:hover {
            background-color: #555;
        }

        @keyframes fadeIn {
            from { opacity: 0.8; }
            to { opacity: 1; }
        }

        @keyframes fadeInText {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeInBackground {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeInButton {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeInUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes fadeInIframe {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeInImage {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeInTable {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Mobile Friendly Styles */
        @media (max-width: 768px) {
            h1 {
                font-size: 2.5em;
            }

            .social-buttons {
                flex-direction: column;
                gap: 10px;
            }

            .button {
                font-size: 1em;
                padding: 12px 25px;
            }

            .footer-text {
                font-size: 1em;
            }

            iframe {
                height: 300px;
            }

            img {
                width: 120px;
                height: 120px;
            }

            .staff-section table {
                width: 90%;
            }

            .staff-section th, .staff-section td {
                font-size: 1em;
                padding: 10px;
            }
        }

        /* Extra Large Mobile Devices */
        @media (max-width: 500px) {
            h1 {
                font-size: 2em;
            }

            .button {
                padding: 10px 20px;
                font-size: 0.9em;
            }

            iframe {
                height: 250px;
            }

            img {
                width: 100px;
                height: 100px;
            }

            .footer-text {
                font-size: 0.9em;
            }

            .staff-section table {
                width: 100%;
            }
        }
    </style>
</head>
